name: gesin
description: "GESIN - Gestion des Inondations au Sénégal. Application mobile d'alerte et de prédiction des inondations."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.6.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # HTTP & API
  dio: ^5.7.0
  retrofit: ^4.4.1

  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI / Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.4
  flutter_animate: ^4.5.2

  # Permissions & Device
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.1
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^17.2.4

  # Utils
  intl: ^0.19.0
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # Supabase
  supabase_flutter: ^2.8.4
  http: ^1.2.2
  mime: ^1.0.6
  http_parser: ^4.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  retrofit_generator: ^9.1.4
  json_annotation: ^4.9.0
  json_serializable: ^6.9.3

flutter:
  uses-material-design: true
